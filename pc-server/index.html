<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>掌控板 · BMP388 实时数据</title>
<style>
  :root {
    color-scheme: dark;
    --page:          #0d0d0d;
    --surface-1:     #1a1a19;
    --text-primary:  #ffffff;
    --text-secondary:#c3c2b7;
    --text-muted:    #898781;
    --grid:          #2c2c2a;
    --axis:          #383835;
    --border:        rgba(255,255,255,0.10);

    /* 三个系列色：深色表面上的分类色板槽位 1/2/3，已通过校验 */
    --series-temp:   #3987e5;
    --series-press:  #d95926;
    --series-alt:    #199e70;

    --good:          #0ca30c;
    --critical:      #d03b3b;

    --radius: 10px;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    padding: 24px;
    background: var(--page);
    color: var(--text-primary);
    font-family: system-ui, -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
    font-size: 14px;
    line-height: 1.5;
  }

  .wrap { max-width: 1100px; margin: 0 auto; }

  header {
    display: flex; align-items: baseline; justify-content: space-between;
    gap: 16px; flex-wrap: wrap; margin-bottom: 20px;
  }
  h1 { font-size: 19px; font-weight: 600; margin: 0; letter-spacing: .2px; }
  .sub { color: var(--text-muted); font-size: 13px; margin-top: 2px; }

  .badge {
    display: inline-flex; align-items: center; gap: 7px;
    padding: 5px 11px; border: 1px solid var(--border);
    border-radius: 999px; font-size: 13px;
    color: var(--text-secondary); white-space: nowrap;
  }
  .badge .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--text-muted); }
  .badge.online  .dot { background: var(--good); }
  .badge.offline .dot { background: var(--critical); }

  .kpis { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 20px; }
  .tile {
    background: var(--surface-1); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 14px 16px;
  }
  .tile .label {
    display: flex; align-items: center; gap: 7px;
    color: var(--text-secondary); font-size: 13px; margin-bottom: 6px;
  }
  /* 身份靠文字旁边的色块，文字本身永远不穿系列色 */
  .tile .key { width: 14px; height: 3px; border-radius: 2px; flex: none; }
  .tile .value { font-size: 30px; font-weight: 600; letter-spacing: -.5px; }
  .tile .unit { font-size: 14px; font-weight: 400; color: var(--text-muted); margin-left: 3px; }
  .tile .delta { font-size: 12px; color: var(--text-muted); margin-top: 3px; min-height: 18px; }

  .controls { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; flex-wrap: wrap; }
  .controls .spacer { flex: 1; }
  .seg { display: inline-flex; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
  .seg button {
    appearance: none; border: 0; background: transparent; color: var(--text-secondary);
    padding: 6px 13px; font: inherit; font-size: 13px; cursor: pointer;
  }
  .seg button + button { border-left: 1px solid var(--border); }
  .seg button:hover { background: rgba(255,255,255,0.05); }
  .seg button[aria-pressed="true"] { background: rgba(255,255,255,0.10); color: var(--text-primary); }

  /* 录制按钮。状态靠「圆点 + 文字」两个通道，不单靠颜色表意 */
  .recbtn {
    appearance: none; font: inherit; font-size: 13px; cursor: pointer;
    padding: 7px 16px; border-radius: 8px;
    border: 1px solid var(--border); background: transparent; color: var(--text-primary);
    display: inline-flex; align-items: center; gap: 8px;
    transition: background .12s, border-color .12s;
  }
  .recbtn:hover:not(:disabled) { background: rgba(255,255,255,0.06); }
  .recbtn:disabled { opacity: .5; cursor: default; }
  .recbtn .ic { width: 9px; height: 9px; border-radius: 50%; background: var(--text-muted); flex: none; }
  .recbtn.on { border-color: rgba(208,59,59,0.55); background: rgba(208,59,59,0.13); }
  .recbtn.on .ic { background: var(--critical); animation: recpulse 1.6s ease-in-out infinite; }
  @keyframes recpulse { 0%,100% { opacity: 1 } 50% { opacity: .3 } }
  .recinfo { color: var(--text-muted); font-size: 12px; font-variant-numeric: tabular-nums; }

  .panels {
    background: var(--surface-1); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 6px 6px 2px; position: relative;
  }
  .panel { position: relative; }
  .panel + .panel { border-top: 1px solid var(--grid); }
  .panel .head {
    display: flex; align-items: baseline; gap: 8px;
    padding: 8px 10px 0; font-size: 13px; color: var(--text-secondary);
  }
  .panel .head .key { width: 14px; height: 3px; border-radius: 2px; }
  .panel .head .range {
    color: var(--text-muted); font-size: 12px; margin-left: auto;
    font-variant-numeric: tabular-nums;
  }
  canvas { display: block; width: 100%; height: 148px; cursor: crosshair; }

  .tip {
    position: absolute; pointer-events: none; opacity: 0;
    background: #232322; border: 1px solid var(--border); border-radius: 8px;
    padding: 8px 10px; font-size: 12px; min-width: 150px;
    box-shadow: 0 6px 22px rgba(0,0,0,.5); transition: opacity .08s; z-index: 5;
  }
  .tip .t { color: var(--text-muted); margin-bottom: 5px; font-variant-numeric: tabular-nums; }
  .tip .row { display: flex; align-items: center; gap: 7px; }
  .tip .row + .row { margin-top: 3px; }
  .tip .row .key { width: 10px; height: 3px; border-radius: 2px; flex: none; }
  .tip .row .n { color: var(--text-secondary); }
  .tip .row .v { margin-left: auto; color: var(--text-primary); font-variant-numeric: tabular-nums; }

  details { margin-top: 18px; }
  summary { cursor: pointer; color: var(--text-secondary); font-size: 13px; padding: 6px 0; user-select: none; }
  summary:hover { color: var(--text-primary); }
  table { border-collapse: collapse; width: 100%; font-size: 13px; margin-top: 8px; }
  th, td { text-align: right; padding: 7px 10px; border-bottom: 1px solid var(--grid); }
  th:first-child, td:first-child { text-align: left; }
  th { color: var(--text-muted); font-weight: 500; }
  td { color: var(--text-secondary); font-variant-numeric: tabular-nums; }
  td:first-child { font-variant-numeric: tabular-nums; }

  footer {
    margin-top: 18px; display: flex; align-items: center; gap: 14px;
    color: var(--text-muted); font-size: 12px; flex-wrap: wrap;
  }
  footer a { color: var(--text-secondary); }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div>
      <h1>掌控板 · BMP388 实时数据</h1>
      <div class="sub">温度 / 气压 / 高度</div>
    </div>
    <div class="badge" id="badge"><span class="dot"></span><span id="badgeText">连接中…</span></div>
  </header>

  <div class="kpis">
    <div class="tile">
      <div class="label"><span class="key" style="background:var(--series-temp)"></span>温度</div>
      <div class="value" id="v0">—<span class="unit">°C</span></div>
      <div class="delta" id="d0"></div>
    </div>
    <div class="tile">
      <div class="label"><span class="key" style="background:var(--series-press)"></span>气压</div>
      <div class="value" id="v1">—<span class="unit">hPa</span></div>
      <div class="delta" id="d1"></div>
    </div>
    <div class="tile">
      <div class="label"><span class="key" style="background:var(--series-alt)"></span>高度</div>
      <div class="value" id="v2">—<span class="unit">m</span></div>
      <div class="delta" id="d2"></div>
    </div>
  </div>

  <div class="controls">
    <div class="seg" id="range">
      <button data-sec="60">1 分钟</button>
      <button data-sec="600" aria-pressed="true">10 分钟</button>
      <button data-sec="3600">1 小时</button>
      <button data-sec="0">全部</button>
    </div>
    <span class="spacer"></span>
    <span class="recinfo" id="recInfo"></span>
    <button class="recbtn" id="recBtn"><span class="ic"></span>开始记录</button>
  </div>

  <div class="panels" id="panels">
    <div class="panel">
      <div class="head"><span class="key" style="background:var(--series-temp)"></span>温度<span class="range" id="r0"></span></div>
      <canvas id="c0"></canvas>
    </div>
    <div class="panel">
      <div class="head"><span class="key" style="background:var(--series-press)"></span>气压<span class="range" id="r1"></span></div>
      <canvas id="c1"></canvas>
    </div>
    <div class="panel">
      <div class="head"><span class="key" style="background:var(--series-alt)"></span>高度<span class="range" id="r2"></span></div>
      <canvas id="c2"></canvas>
    </div>
    <div class="tip" id="tip"></div>
  </div>

  <details>
    <summary>表格视图（最近 30 条）</summary>
    <table>
      <thead><tr><th>时间</th><th>温度 °C</th><th>气压 hPa</th><th>高度 m</th></tr></thead>
      <tbody id="tbody"></tbody>
    </table>
  </details>

  <footer>
    <span id="stats">等待数据…</span>
    <span style="flex:1"></span>
    <a href="/api/download" id="dl">下载 CSV</a>
  </footer>

</div>

<script>
'use strict';

// ---------- 配置 ----------
const SERIES = [
  { name: '温度', field: 'temp',  unit: '°C',  color: '--series-temp',  dp: 2 },
  { name: '气压', field: 'press', unit: 'hPa', color: '--series-press', dp: 2 },
  { name: '高度', field: 'alt',   unit: 'm',   color: '--series-alt',   dp: 1 },
];
const POLL_MS     = 2000;      // 轮询间隔
const OFFLINE_MS  = 7000;      // 超过这么久没数据就算掉线
const GAP_MS      = 5000;      // 相邻点间隔超过这么久就断开折线（20Hz 下正常是 50ms）
const INIT_N      = 24000;     // 首次加载拉多少点（20Hz 下 = 20 分钟）
const LOCAL_MAX   = 72000;     // 浏览器本地最多留多少点，和服务端上限一致
const PAD_L = 52, PAD_R = 62, PAD_T = 8, PAD_B = 8;
const X_LABEL_H = 18;

const css = getComputedStyle(document.documentElement);
const col = (v) => css.getPropertyValue(v).trim();
const C = {
  surface: col('--surface-1'),
  textPrimary: col('--text-primary'),
  muted: col('--text-muted'),
  grid: col('--grid'),
  axis: col('--axis'),
};

let points   = [];
let lastSeq  = 0;          // 增量拉取的游标
let lastRecv = 0;
let rangeSec = 600;
let hoverIdx = null;
let sampleHz = 0;          // 实测采样率

// 录制状态由服务端持有（刷新页面也不丢），这里只是镜像一份用来渲染
let rec = { recording: false, recRows: 0, recStart: 0, recFile: null };

// ---------- 取数：首次拉一段，之后只拉新增的 ----------
async function poll() {
  try {
    const url = lastSeq === 0
      ? `/api/latest?n=${INIT_N}`
      : `/api/latest?since=${lastSeq}`;
    const j = await (await fetch(url, { cache: 'no-store' })).json();

    if (lastSeq === 0) {
      points = j.points || [];
    } else if (j.points && j.points.length) {
      points = points.concat(j.points);
    }
    if (points.length > LOCAL_MAX) points.splice(0, points.length - LOCAL_MAX);
    if (points.length) lastSeq = points[points.length - 1].seq;

    lastRecv = j.lastRecvAt || 0;
    document.getElementById('stats').textContent =
      `累计 ${j.totalRecv} 点 · ${j.batches} 批 · 缓冲 ${points.length} 点`;

    rec = {
      recording: !!j.recording,
      recRows: j.recRows || 0,
      recStart: j.recStart || 0,
      recFile: j.recFile || null,
    };
    paintRec();

    update();
  } catch (e) {
    setBadge(false, '服务未连接');
  }
}

// ---------- 状态徽章：图标 + 文字，不靠颜色单独表意 ----------
function setBadge(online, text) {
  const b = document.getElementById('badge');
  b.className = 'badge ' + (online ? 'online' : 'offline');
  document.getElementById('badgeText').textContent = (online ? '在线 · ' : '⚠ ') + text;
}

// ---------- 刻度 ----------
function niceTicks(min, max, want) {
  if (!Number.isFinite(min) || !Number.isFinite(max)) return [0];
  if (min === max) { min -= 1; max += 1; }
  const raw  = (max - min) / want;
  const mag  = Math.pow(10, Math.floor(Math.log10(raw)));
  const norm = raw / mag;
  const step = (norm <= 1 ? 1 : norm <= 2 ? 2 : norm <= 5 ? 5 : 10) * mag;
  const lo = Math.floor(min / step) * step;
  const hi = Math.ceil(max / step) * step;
  const out = [];
  for (let v = lo; v <= hi + step * 1e-6; v += step) out.push(v);
  return out;
}

function fmt(v, dp) {
  return v.toLocaleString('zh-CN', { minimumFractionDigits: dp, maximumFractionDigits: dp });
}

// 用循环统计。绝不能用 Math.min(...arr) —— 点数过万就会
// RangeError: Maximum call stack size exceeded（参数展开有上限）
function stats(pts, field) {
  let lo = Infinity, hi = -Infinity, sum = 0;
  for (let i = 0; i < pts.length; i++) {
    const v = pts[i][field];
    if (v < lo) lo = v;
    if (v > hi) hi = v;
    sum += v;
  }
  return { lo, hi, avg: sum / pts.length };
}

// ---------- 可见窗口 ----------
function visible() {
  if (!points.length) return [];
  if (rangeSec === 0) return points;
  const cut = Date.now() - rangeSec * 1000;
  // 点是按时间递增的，二分找起点，别线性扫
  let lo = 0, hi = points.length - 1, start = points.length;
  while (lo <= hi) {
    const mid = (lo + hi) >> 1;
    if (points[mid].recvAt >= cut) { start = mid; hi = mid - 1; } else lo = mid + 1;
  }
  const v = points.slice(start);
  return v.length >= 2 ? v : points.slice(-2);
}

// ---------- 折线取点 ----------
// 点数远多于像素列时，每列只取最小值和最大值两个点：
// 线段数从几万降到几千，但尖峰不会被抹平。
function pathPoints(seg, field, xOf, plotW) {
  const cols = Math.max(2, Math.round(plotW / 2));
  if (seg.length <= cols * 2) {
    return seg.map(p => [xOf(p.recvAt), p[field]]);
  }
  const out = [];
  const step = seg.length / cols;
  for (let b = 0; b < cols; b++) {
    const i0 = Math.floor(b * step);
    const i1 = Math.min(seg.length, Math.max(i0 + 1, Math.floor((b + 1) * step)));
    let lo = i0, hi = i0;
    for (let i = i0; i < i1; i++) {
      if (seg[i][field] < seg[lo][field]) lo = i;
      if (seg[i][field] > seg[hi][field]) hi = i;
    }
    if (lo === hi) {
      out.push([xOf(seg[lo].recvAt), seg[lo][field]]);
    } else if (lo < hi) {
      out.push([xOf(seg[lo].recvAt), seg[lo][field]]);
      out.push([xOf(seg[hi].recvAt), seg[hi][field]]);
    } else {
      out.push([xOf(seg[hi].recvAt), seg[hi][field]]);
      out.push([xOf(seg[lo].recvAt), seg[lo][field]]);
    }
  }
  return out;
}

// 按断线切成若干连续段
function splitSegments(pts) {
  const segs = [];
  let cur = [pts[0]];
  for (let i = 1; i < pts.length; i++) {
    if (pts[i].recvAt - pts[i - 1].recvAt > GAP_MS) { segs.push(cur); cur = []; }
    cur.push(pts[i]);
  }
  segs.push(cur);
  return segs;
}

// ---------- 画一个面板 ----------
function drawPanel(i, pts, xOf, showX) {
  const cv = document.getElementById('c' + i);
  const dpr = window.devicePixelRatio || 1;
  const rect = cv.getBoundingClientRect();
  if (rect.width === 0) return;
  cv.width  = Math.round(rect.width  * dpr);
  cv.height = Math.round(rect.height * dpr);
  const ctx = cv.getContext('2d');
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

  const W = rect.width, H = rect.height;
  const bot = H - PAD_B - (showX ? X_LABEL_H : 0);
  const s = SERIES[i];
  const color = col(s.color);
  const plotW = W - PAD_L - PAD_R;

  ctx.clearRect(0, 0, W, H);

  if (pts.length === 0) {
    ctx.fillStyle = C.muted;
    ctx.font = '13px system-ui, sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('暂无数据', W / 2, H / 2);
    return;
  }

  // Y 轴范围（用全部可见点算，不是抽稀后的，免得量程被抽窄）
  const st = stats(pts, s.field);
  let lo = st.lo, hi = st.hi;
  const span = (hi - lo) || Math.abs(hi) * 0.02 || 1;
  lo -= span * 0.08; hi += span * 0.08;
  const ticks = niceTicks(lo, hi, 3);
  const y0 = ticks[0], y1 = ticks[ticks.length - 1];
  const yOf = (v) => bot - ((v - y0) / (y1 - y0 || 1)) * (bot - PAD_T);

  // 网格线：1px 实线，退到背景里
  ctx.strokeStyle = C.grid;
  ctx.lineWidth = 1;
  ctx.font = '11px system-ui, sans-serif';
  ctx.textAlign = 'right';
  ctx.textBaseline = 'middle';
  const dp = (y1 - y0) >= 20 ? 0 : (y1 - y0) >= 2 ? 1 : 2;
  for (const t of ticks) {
    const y = Math.round(yOf(t)) + 0.5;
    ctx.beginPath(); ctx.moveTo(PAD_L, y); ctx.lineTo(W - PAD_R, y); ctx.stroke();
    ctx.fillStyle = C.muted;
    ctx.fillText(fmt(t, dp), PAD_L - 8, y);
  }

  // 折线：2px，圆角接头/端点
  ctx.strokeStyle = color;
  ctx.lineWidth = 2;
  ctx.lineJoin = 'round';
  ctx.lineCap = 'round';
  for (const seg of splitSegments(pts)) {
    const pp = pathPoints(seg, s.field, xOf, plotW);
    if (pp.length === 1) {
      ctx.beginPath();
      ctx.arc(pp[0][0], yOf(pp[0][1]), 1.5, 0, Math.PI * 2);
      ctx.fillStyle = color; ctx.fill();
      continue;
    }

    // 面积色块：淡淡一层（10% 不透明度，不是实心块），
    // 单序列的时间曲线填充后走势一眼就能看出来，比只有一条细线直观得多
    ctx.globalAlpha = 0.10;
    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.moveTo(pp[0][0], bot);
    for (let k = 0; k < pp.length; k++) ctx.lineTo(pp[k][0], yOf(pp[k][1]));
    ctx.lineTo(pp[pp.length - 1][0], bot);
    ctx.closePath();
    ctx.fill();
    ctx.globalAlpha = 1;

    ctx.beginPath();
    ctx.moveTo(pp[0][0], yOf(pp[0][1]));
    for (let k = 1; k < pp.length; k++) ctx.lineTo(pp[k][0], yOf(pp[k][1]));
    ctx.stroke();
  }

  // 末端点：直径 8px，外面 2px 表面色环
  const last = pts[pts.length - 1];
  const lx = xOf(last.recvAt), ly = yOf(last[s.field]);
  ctx.beginPath(); ctx.arc(lx, ly, 6, 0, Math.PI * 2);
  ctx.fillStyle = C.surface; ctx.fill();
  ctx.beginPath(); ctx.arc(lx, ly, 4, 0, Math.PI * 2);
  ctx.fillStyle = color; ctx.fill();

  // 末端直接标注数值（文字用文本色，不穿系列色）
  ctx.fillStyle = C.textPrimary;
  ctx.font = '600 12px system-ui, sans-serif';
  ctx.textAlign = 'left';
  ctx.textBaseline = 'middle';
  ctx.fillText(fmt(last[s.field], s.dp), W - PAD_R + 8, ly);

  // 面板右上角显示这段的最小 / 平均 / 最大
  const rng = document.getElementById('r' + i);
  if (rng) {
    rng.textContent = `最小 ${fmt(st.lo, s.dp)}  ·  平均 ${fmt(st.avg, s.dp)}  ·  `
                    + `最大 ${fmt(st.hi, s.dp)} ${s.unit}`;
  }

  // 最下面板画时间轴
  if (showX) {
    ctx.fillStyle = C.muted;
    ctx.font = '11px system-ui, sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'top';
    const n = 4;
    const tt0 = pts[0].recvAt, tt1 = pts[pts.length - 1].recvAt;
    // 跨度小于 10 秒就显示到毫秒，否则秒级够用
    const withMs = (tt1 - tt0) < 10000;
    let lastX = -Infinity;
    for (let k = 0; k < n; k++) {
      const target = tt0 + (k / (n - 1)) * (tt1 - tt0);
      // 按时间取最近的点，不按下标——数据疏密不均时下标取样会叠字
      let lo2 = 0, hi2 = pts.length - 1;
      while (lo2 < hi2) {
        const mid = (lo2 + hi2) >> 1;
        if (pts[mid].recvAt < target) lo2 = mid + 1; else hi2 = mid;
      }
      const cand = [pts[Math.max(0, lo2 - 1)], pts[lo2]];
      const p = Math.abs(cand[0].recvAt - target) < Math.abs(cand[1].recvAt - target) ? cand[0] : cand[1];
      const x = Math.min(Math.max(xOf(p.recvAt), PAD_L), W - PAD_R);
      if (x - lastX < 74) continue;      // 离上一个标签太近就跳过，宁缺勿叠
      lastX = x;
      const t = new Date(p.recvAt);
      let lbl = String(t.getHours()).padStart(2, '0') + ':' +
                String(t.getMinutes()).padStart(2, '0') + ':' +
                String(t.getSeconds()).padStart(2, '0');
      if (withMs) lbl += '.' + String(t.getMilliseconds()).padStart(3, '0');
      ctx.fillText(lbl, x, bot + 5);
    }
  }

  // 悬停十字线
  if (hoverIdx !== null && hoverIdx < pts.length) {
    const p = pts[hoverIdx];
    const x = Math.round(xOf(p.recvAt)) + 0.5;
    ctx.strokeStyle = C.axis;
    ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(x, PAD_T); ctx.lineTo(x, bot); ctx.stroke();

    const y = yOf(p[s.field]);
    ctx.beginPath(); ctx.arc(x, y, 6, 0, Math.PI * 2);
    ctx.fillStyle = C.surface; ctx.fill();
    ctx.beginPath(); ctx.arc(x, y, 4, 0, Math.PI * 2);
    ctx.fillStyle = color; ctx.fill();
  }
}

// ---------- 整体刷新 ----------
function update() {
  const now = Date.now();
  const age = lastRecv ? now - lastRecv : Infinity;
  const online = age < OFFLINE_MS;

  if (!points.length) setBadge(false, '等待板子发数据');
  else if (online) setBadge(true, `${(age / 1000).toFixed(1)} 秒前`);
  else setBadge(false, `已断线 ${Math.floor(age / 1000)} 秒`);

  const pts = visible();
  const last = pts[pts.length - 1];

  // 实测采样率：取可见点里相邻间隔的中位数
  if (pts.length > 10) {
    const d = [];
    for (let i = 1; i < Math.min(pts.length, 200); i++) d.push(pts[i].recvAt - pts[i - 1].recvAt);
    d.sort((a, b) => a - b);
    const med = d[d.length >> 1];
    sampleHz = med > 0 ? Math.round(1000 / med) : 0;
  }

  for (let i = 0; i < 3; i++) {
    const s = SERIES[i];
    const ve = document.getElementById('v' + i);
    const de = document.getElementById('d' + i);
    if (!last) { ve.innerHTML = '—<span class="unit">' + s.unit + '</span>'; de.textContent = ''; continue; }
    ve.innerHTML = fmt(last[s.field], s.dp) + '<span class="unit">' + s.unit + '</span>';

    // 和 1 分钟前比。历史不足 45 秒就不显示——否则会拿最早的点冒充“1 分钟前”。
    const target = last.recvAt - 60000;
    let lo = 0, hi = pts.length - 1;
    while (lo < hi) { const mid = (lo + hi) >> 1; if (pts[mid].recvAt < target) lo = mid + 1; else hi = mid; }
    const ref = pts[Math.max(0, lo - 1)];
    const spanMs = last.recvAt - pts[0].recvAt;
    if (ref !== last && spanMs >= 45000 && Math.abs(ref.recvAt - target) <= 20000) {
      const dv = last[s.field] - ref[s.field];
      de.textContent = `较 1 分钟前 ${dv > 0 ? '+' : ''}${dv.toFixed(s.dp)} ${s.unit}`;
    } else {
      de.textContent = sampleHz ? `采样 ${sampleHz} Hz` : '';
    }
  }

  // 共享 X 轴
  const t0 = pts[0].recvAt, t1 = pts[pts.length - 1].recvAt;
  const spanX = (t1 - t0) || 1;
  const first = document.getElementById('c0').getBoundingClientRect().width;
  const xOf = (t) => PAD_L + ((t - t0) / spanX) * (first - PAD_L - PAD_R);

  for (let i = 0; i < 3; i++) drawPanel(i, pts, xOf, i === 2);
  renderTable(pts);
}

function renderTable(pts) {
  const rows = pts.slice(-30).reverse();
  document.getElementById('tbody').innerHTML = rows.map(p => {
    const t = new Date(p.recvAt);
    const hh = String(t.getHours()).padStart(2, '0') + ':' +
               String(t.getMinutes()).padStart(2, '0') + ':' +
               String(t.getSeconds()).padStart(2, '0') + '.' +
               String(t.getMilliseconds()).padStart(3, '0');
    return `<tr><td>${hh}</td><td>${fmt(p.temp, 2)}</td><td>${fmt(p.press, 2)}</td><td>${fmt(p.alt, 1)}</td></tr>`;
  }).join('');
}

// ---------- 悬停 ----------
const tip = document.getElementById('tip');
const panels = document.getElementById('panels');

function onMove(ev) {
  const pts = visible();
  if (pts.length < 2) return;
  const cv = ev.currentTarget;
  const rect = cv.getBoundingClientRect();
  const x = ev.clientX - rect.left;
  const W = rect.width;

  const t0 = pts[0].recvAt, t1 = pts[pts.length - 1].recvAt;
  const spanX = (t1 - t0) || 1;
  const t = t0 + ((x - PAD_L) / (W - PAD_L - PAD_R)) * spanX;

  let lo = 0, hi = pts.length - 1;
  while (lo < hi) { const mid = (lo + hi) >> 1; if (pts[mid].recvAt < t) lo = mid + 1; else hi = mid; }
  const cand = [pts[Math.max(0, lo - 1)], pts[lo]];
  hoverIdx = Math.abs(cand[0].recvAt - t) < Math.abs(cand[1].recvAt - t)
    ? Math.max(0, lo - 1) : lo;

  const p = pts[hoverIdx];
  const dt = new Date(p.recvAt);
  const hh = String(dt.getHours()).padStart(2, '0') + ':' +
             String(dt.getMinutes()).padStart(2, '0') + ':' +
             String(dt.getSeconds()).padStart(2, '0') + '.' +
             String(dt.getMilliseconds()).padStart(3, '0');

  tip.innerHTML = `<div class="t">${hh}</div>` + SERIES.map(s =>
    `<div class="row"><span class="key" style="background:var(${s.color})"></span>` +
    `<span class="n">${s.name}</span><span class="v">${fmt(p[s.field], s.dp)} ${s.unit}</span></div>`
  ).join('');

  const pr = panels.getBoundingClientRect();
  tip.style.opacity = '1';
  const tw = tip.offsetWidth;
  let tx = ev.clientX - pr.left + 14;
  if (tx + tw > pr.width - 6) tx = ev.clientX - pr.left - tw - 14;
  tip.style.left = Math.max(6, tx) + 'px';
  const ty = ev.clientY - pr.top + 14;
  tip.style.top = Math.min(Math.max(6, ty), pr.height - 90) + 'px';

  update();
}

function onLeave() { hoverIdx = null; tip.style.opacity = '0'; update(); }

for (let i = 0; i < 3; i++) {
  const cv = document.getElementById('c' + i);
  cv.addEventListener('mousemove', onMove);
  cv.addEventListener('mouseleave', onLeave);
}

// ---------- 时间范围 ----------
document.getElementById('range').addEventListener('click', (e) => {
  const b = e.target.closest('button');
  if (!b) return;
  rangeSec = Number(b.dataset.sec);
  for (const x of e.currentTarget.querySelectorAll('button')) {
    x.setAttribute('aria-pressed', String(x === b));
  }
  hoverIdx = null; tip.style.opacity = '0';
  update();
});

window.addEventListener('resize', () => update());

// ---------- 录制 ----------
// 记录状态存在服务端，所以刷新页面、关掉浏览器都不会中断记录。
const recBtn  = document.getElementById('recBtn');
const recInfo = document.getElementById('recInfo');

function hms(ms) {
  const s = Math.max(0, Math.floor(ms / 1000));
  return String(Math.floor(s / 3600)).padStart(2, '0') + ':' +
         String(Math.floor(s % 3600 / 60)).padStart(2, '0') + ':' +
         String(s % 60).padStart(2, '0');
}

function paintRec() {
  if (rec.recording) {
    recBtn.className = 'recbtn on';
    recBtn.innerHTML = '<span class="ic"></span>停止记录';
    recInfo.textContent = `记录中 ${rec.recRows.toLocaleString()} 行 · ` +
                          hms(Date.now() - rec.recStart);
  } else {
    recBtn.className = 'recbtn';
    recBtn.innerHTML = '<span class="ic"></span>开始记录';
    recInfo.textContent = rec.recFile
      ? `上次 ${rec.recFile}（${rec.recRows.toLocaleString()} 行）`
      : '未开始记录';
  }
  document.getElementById('dl').textContent =
    rec.recFile ? '下载 ' + rec.recFile.replace(/^data_/, '').replace(/\.csv$/, '') : '下载 CSV';
}

recBtn.addEventListener('click', async () => {
  recBtn.disabled = true;
  try {
    const want = !rec.recording;
    const r = await fetch('/api/record', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ on: want }),
    });
    const j = await r.json();
    if (!j.ok) alert((want ? '开始' : '停止') + '记录失败：' + (j.error || '未知错误'));
    await poll();                 // 立刻同步服务端状态，别等下一次轮询
  } catch (e) {
    alert('连不上服务：' + e.message);
  } finally {
    recBtn.disabled = false;
  }
});

paintRec();

poll();
setInterval(poll, POLL_MS);
setInterval(() => {
  if (hoverIdx === null) update();
  paintRec();                     // 让“已记录时长”每秒都在走
}, 1000);
</script>
</body>
